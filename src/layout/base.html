<!DOCTYPE html>
<html>
  <head>
    <title>{{title}}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>"
    />
    <link
      rel="stylesheet"
      href="/vendor/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="/vendor/jquery/dist/jquery.min.js"></script>
    <script src="/vendor/jquery-ui/jquery-ui.min.js"></script>
    <script src="/vendor/bootstrap/dist/js/bootstrap.min.js"></script>

    <!-- Core modules -->
    <script src="/js/core/alerts.js"></script>
    <script src="/js/core/navigation.js"></script>
    <script src="/js/core/utils.js"></script>

    <!-- Feature modules -->
    <script src="/js/modules/collections.js"></script>
    <script src="/js/modules/items.js"></script>
    <script src="/js/modules/media.js"></script>
    <script src="/js/modules/webhooks.js"></script>

    <!-- Main application entry point -->
    <script src="/js/app.js"></script>
    <style>
      html,
      body {
        height: 100% !important;
        margin: 0 !important;
        background-color: #121212 !important;
        color: #e0e0e0 !important;
      }
      body {
        display: flex !important;
        flex-direction: column !important;
        min-height: 100vh !important;
      }
      .container.main-content {
        flex: 1 !important;
      }
      /* Dark mode overrides */
      .card {
        background-color: #1e1e1e !important;
        border-color: #2d2d2d !important;
        color: #e0e0e0 !important;
      }
      .card-header {
        background-color: #2d2d2d !important;
        color: #e0e0e0 !important;
        border-bottom-color: #404040 !important;
      }
      .navbar {
        background-color: #1a1a1a !important;
      }
      .navbar-brand,
      .nav-link {
        color: #e0e0e0 !important;
      }
      .nav-link:hover {
        color: #ffffff !important;
      }
      .table {
        color: #e0e0e0 !important;
      }
      .table thead th {
        border-color: #2d2d2d !important;
        background-color: #2d2d2d !important;
        color: #e0e0e0 !important;
      }
      .table td,
      .table th {
        border-color: #2d2d2d !important;
        background-color: #1a1a1a !important;
        color: #e0e0e0 !important;
      }
      .table-striped tbody tr:nth-of-type(odd) {
        background-color: rgba(255, 255, 255, 0.05) !important;
      }
      .table-striped tbody tr:nth-of-type(even) {
        background-color: #1e1e1e !important;
      }
      .img-thumbnail {
        background-color: #2d2d2d !important;
        border-color: #404040 !important;
      }
      .form-control,
      .form-select {
        background-color: #2d2d2d !important;
        border-color: #404040 !important;
        color: #e0e0e0 !important;
      }
      .form-control:focus,
      .form-select:focus {
        background-color: #2d2d2d !important;
        border-color: #404040 !important;
        color: #e0e0e0 !important;
      }
      .form-label {
        color: #e0e0e0 !important;
      }
      .btn-primary {
        background-color: #0d6efd !important;
        border-color: #0d6efd !important;
        color: #ffffff !important;
      }
      .btn-secondary {
        background-color: #2d2d2d !important;
        border-color: #404040 !important;
        color: #e0e0e0 !important;
      }

      .list-group-item {
        background-color: #1e1e1e !important;
        border-color: #2d2d2d !important;
        color: #e0e0e0 !important;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      span,
      div {
        color: #e0e0e0 !important;
      }
      .text-muted {
        color: #9e9e9e !important;
      }
      .dropdown-menu {
        background-color: #1e1e1e !important;
        border-color: #2d2d2d !important;
      }
      .dropdown-item {
        color: #e0e0e0 !important;
      }
      .dropdown-item:hover {
        background-color: #2d2d2d !important;
        color: #ffffff !important;
      }
      /* Alert Dark Mode */
      .alert {
        background-color: #1e1e1e !important;
        border-color: #2d2d2d !important;
        color: #e0e0e0 !important;
      }
      .alert-info {
        background-color: rgba(13, 202, 240, 0.15) !important;
        border-color: rgba(13, 202, 240, 0.4) !important;
        color: #e0e0e0 !important;
      }
      .alert-success {
        background-color: rgba(25, 135, 84, 0.7) !important;
        border-color: rgba(25, 135, 84, 0.4) !important;
        color: #e0e0e0 !important;
      }
      .alert-warning {
        background-color: rgba(255, 193, 7, 0.15) !important;
        border-color: rgba(255, 193, 7, 0.4) !important;
        color: #e0e0e0 !important;
      }
      .alert-danger {
        background-color: rgba(220, 53, 69, 0.15) !important;
        border-color: rgba(220, 53, 69, 0.4) !important;
        color: #e0e0e0 !important;
      }
      /* End Alert Dark Mode */
      /* Accordion Dark Mode */
      .accordion-item {
        background-color: #1e1e1e !important;
        border-color: #2d2d2d !important;
      }
      .accordion-button {
        background-color: #1e1e1e !important;
        color: #e0e0e0 !important;
      }
      .accordion-button:not(.collapsed) {
        background-color: #2d2d2d !important;
        color: #ffffff !important;
      }
      .accordion-button:focus {
        border-color: #404040 !important;
        box-shadow: none !important;
      }
      .accordion-body {
        background-color: #1e1e1e !important;
        border-top: 1px solid #2d2d2d !important;
      }
      /* End Accordion Dark Mode */
      .modal-content {
        background-color: #1e1e1e !important;
        border-color: #2d2d2d !important;
      }
      .modal-header {
        border-bottom-color: #2d2d2d !important;
      }
      .modal-footer {
        border-top-color: #2d2d2d !important;
      }
      .breadcrumb-item.active {
        color: #e0e0e0 !important;
      }
      .form-control::placeholder {
        color: #808080 !important;
        opacity: 1 !important;
      }
      .form-control:-ms-input-placeholder {
        color: #808080 !important;
      }
      .form-control::-ms-input-placeholder {
        color: #808080 !important;
      }
    </style>
  </head>
  <body>
    <!-- Full page loading overlay -->
    <div
      id="fullPageLoader"
      class="d-none"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div class="text-center">
        <div
          class="spinner-border text-light"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="visually-hidden">Loading...</span>
        </div>
        <div class="text-light mt-3">Loading...</div>
      </div>
    </div>

    <!-- @inject:topbar -->

    <!-- Main Content -->
    <div class="container main-content mt-4">
      <!-- @content -->
    </div>

    <!-- @inject:footer -->
  </body>
</html>
