<!-- @layout:base -->
<!-- @title:Content Studio -->

<div class="row mb-4">
  <div class="col-12">
    <h1 class="mb-3">Content Studio</h1>
    <p class="text-muted">
      Create and manage content using structured content models
    </p>
  </div>
</div>

<div class="row">
  <!-- Left Column: Content Models -->
  <div class="col-md-4">
    <div class="card">
      <div
        class="card-header d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0">Content Models</h5>
        <button class="btn btn-primary btn-sm" id="createModelBtn">
          <i class="bi bi-plus-circle"></i> New Model
        </button>
      </div>
      <div class="card-body" id="contentModelsContainer">{{modelsHtml}}</div>
    </div>
  </div>

  <!-- Right Column: Content Items -->
  <div class="col-md-8">
    <div class="card">
      <div
        class="card-header d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0" id="contentItemsTitle">Select a Content Model</h5>
        <button
          class="btn btn-primary btn-sm"
          id="createContentBtn"
          style="display: none"
        >
          <i class="bi bi-plus-circle"></i> New Content
        </button>
      </div>
      <div class="card-body" id="contentItemsContainer">
        <div class="alert alert-info">
          <p class="mb-0">
            Select a content model from the left to view and manage content
            items.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Create Content Model -->
<div class="modal fade" id="createModelModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Content Model</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body">
        <form id="createModelForm">
          <div class="mb-3">
            <label for="modelName" class="form-label">Model Name</label>
            <input
              type="text"
              class="form-control"
              id="modelName"
              required
              placeholder="e.g., Blog Post, Product, Case Study"
            />
          </div>
          <div class="mb-3">
            <label for="modelDescription" class="form-label">Description</label>
            <textarea
              class="form-control"
              id="modelDescription"
              rows="2"
              placeholder="Describe what this content model is for"
            ></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Fields</label>
            <div id="fieldsContainer">
              <!-- Fields will be added here dynamically -->
            </div>
            <button
              type="button"
              class="btn btn-sm btn-outline-primary mt-2"
              id="addFieldBtn"
            >
              <i class="bi bi-plus"></i> Add Field
            </button>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="saveModelBtn">
          Create Model
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Create/Edit Content Item -->
<div class="modal fade" id="contentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="contentModalTitle">Create Content</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body">
        <form id="contentForm">
          <div id="contentFieldsContainer">
            <!-- Dynamic form fields will be generated here -->
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" id="saveContentBtn">
          Save Content
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: View Revisions -->
<div class="modal fade" id="revisionsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Revision History</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body">
        <div id="revisionsContainer">
          <!-- Revisions will be loaded here -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/js/modules/content-studio.js"></script>
